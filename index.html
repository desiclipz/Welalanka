        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #ff2e63;
            --text-color: #ffffff;
            --text-secondary: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #14151c;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            max-width: 1200px;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }

        .content-area {
            flex: 1;
        }

        .sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .media-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
            position: relative;
        }

        .media-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail {
            width: 100%;
            height: 150px;
            background-color: #2a2d37;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-direct {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-direct:hover {
            background-color: #e02554;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            margin-top: auto;
            background-color: #14151c;
            color: var(--text-secondary);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
