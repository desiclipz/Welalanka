    <!-- AUTOMATIC PAGINATION LOGIC -->
    <script>
        (function() {
            const itemsPerPage = 10;
            let currentPage = 1;
            const cards = Array.from(document.querySelectorAll('.media-card'));
            const totalPages = Math.ceil(cards.length / itemsPerPage);

            function showPage(page) {
                if (page < 1) page = 1;
                if (page > totalPages && totalPages > 0) page = totalPages;
                currentPage = page;

                cards.forEach((card, index) => {
                    if (index >= (page - 1) * itemsPerPage && index < page * itemsPerPage) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });

                renderPagination();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function renderPagination() {
                const container = document.getElementById('pagination-controls');
                if (!container) return;
                if (totalPages <= 1) {
                    container.innerHTML = '';
                    return;
                }

                let html = '<div class="flex items-center justify-between gap-2 my-6 p-3 bg-zinc-900 border border-zinc-800 rounded-xl shadow-lg">';
                
                if (currentPage > 1) {
                    html += '<button onclick="window.changeStorePage(' + (currentPage - 1) + ')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold px-3.5 py-2 rounded-lg text-xs flex items-center gap-1.5 transition">' +
                        '<i class="fa-solid fa-arrow-left"></i> Previous' +
                    '</button>';
                } else {
                    html += '<div></div>';
                }

                html += '<span class="text-xs font-medium text-zinc-400">Page ' + currentPage + ' of ' + totalPages + '</span>';

                if (currentPage < totalPages) {
                    html += '<button onclick="window.changeStorePage(' + (currentPage + 1) + ')" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-3.5 py-2 rounded-lg text-xs flex items-center gap-1.5 transition">' +
                        'Next <i class="fa-solid fa-arrow-right"></i>' +
                    '</button>';
                } else {
                    html += '<div></div>';
                }

                html += '</div>';
                container.innerHTML = html;
            }

            window.changeStorePage = function(p) {
                showPage(p);
            };

            showPage(1);
        })();
    </script>
